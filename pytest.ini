[pytest]
# src/ is not a package and the repo convention is to append it to sys.path.
# Doing it once here is cleaner than repeating sys.path juggling in every file.
pythonpath = . src
testpaths = tests
# -q keeps output tight; --strict-markers turns a typo'd @pytest.mark into an
# error rather than silently running the test unmarked.
addopts = -q --strict-markers
